<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AfyaBora - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#004881",
                        "primary-fixed": "#d6e3ff",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#43474e",
                        "primary": "#002045",
                        "surface-tint": "#455f88",
                        "surface-container": "#efedf1",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#001c38",
                        "outline-variant": "#c4c6cf",
                        "primary-container": "#1a365d",
                        "inverse-primary": "#adc7f7",
                        "on-surface": "#1a1c1e",
                        "on-tertiary-fixed-variant": "#41474e",
                        "secondary-container": "#7db6ff",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#dad9dd",
                        "secondary-fixed-dim": "#a2c9ff",
                        "surface-bright": "#faf9fd",
                        "inverse-on-surface": "#f1f0f4",
                        "error": "#ba1a1a",
                        "on-primary-container": "#86a0cd",
                        "on-primary-fixed-variant": "#2d476f",
                        "tertiary-fixed": "#dde3eb",
                        "surface-container-high": "#e9e7eb",
                        "background": "#faf9fd",
                        "secondary": "#1960a3",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#00477f",
                        "surface-container-highest": "#e3e2e6",
                        "on-primary-fixed": "#001b3c",
                        "on-background": "#1a1c1e",
                        "surface-container-low": "#f4f3f7",
                        "on-error": "#ffffff",
                        "tertiary-container": "#30363c",
                        "primary-fixed-dim": "#adc7f7",
                        "on-tertiary-container": "#989fa6",
                        "tertiary": "#1b2127",
                        "outline": "#74777f",
                        "on-tertiary-fixed": "#161c22",
                        "error-container": "#ffdad6",
                        "surface": "#faf9fd",
                        "tertiary-fixed-dim": "#c1c7cf",
                        "surface-variant": "#e3e2e6",
                        "inverse-surface": "#2f3033",
                        "secondary-fixed": "#d3e4ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xl": "32px",
                        "container-max": "1440px",
                        "xs": "4px",
                        "gutter": "20px",
                        "md": "16px",
                        "base": "4px",
                        "sm": "8px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "data-mono": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-bold": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-full flex items-center justify-center overflow-hidden font-body-md relative selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Ambient Background -->
<div class="absolute inset-0 z-0 bg-gradient-to-br from-surface-container-low via-surface to-surface-container flex items-center justify-center pointer-events-none">
<div class="absolute w-[800px] h-[800px] bg-primary-fixed/20 rounded-full blur-3xl opacity-50 -top-48 -right-48"></div>
<div class="absolute w-[600px] h-[600px] bg-secondary-fixed/20 rounded-full blur-3xl opacity-40 bottom-0 -left-24"></div>
</div>
<!-- Login Container -->
<main class="z-10 w-full max-w-md px-md md:px-0">
<div class="glass-panel rounded-xl shadow-lg p-lg md:p-xl flex flex-col items-center">
<!-- Logo / Brand Header -->
<div class="flex flex-col items-center mb-xl w-full">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center mb-md shadow-sm border border-outline-variant/30">
<span class="material-symbols-outlined text-[32px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary font-black tracking-tight mb-xs">AfyaBora</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center max-w-[280px]">Clinical Management System. Please authenticate to access secure patient records.</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-md" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- Username Input -->
<div class="flex flex-col gap-base">
<label class="font-label-bold text-label-bold text-on-surface" for="username">Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">person</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg py-sm pl-[36px] pr-sm focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="username" name="username" placeholder="Enter your clinical ID" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-on-surface" for="password">Password</label>
<a class="font-label-bold text-label-bold text-secondary hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg py-sm pl-[36px] pr-sm focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="mt-sm w-full bg-primary hover:bg-primary/90 text-on-primary font-label-bold text-label-bold rounded-lg py-[12px] flex items-center justify-center gap-sm transition-all shadow-sm hover:shadow-md active:scale-[0.98]" type="submit">
<span>LOGIN</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- System Status Indicator (Optional/Decorative) -->
<div class="mt-lg pt-md border-t border-outline-variant/50 w-full flex items-center justify-center gap-sm text-on-surface-variant">
<span class="w-2 h-2 rounded-full bg-[#10b981] animate-pulse"></span>
<span class="font-label-bold text-label-bold opacity-70">Secure Connection Established</span>
</div>
</div>
</main>
<!-- Navigation Suppressed for Linear/Transactional intent -->
</body></html>
